services:


# ----------База Даних ---------------

  db:
    image: postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  #------- REDIS ---------------------------------------------------

  redis:
    image: redis:7-alpine

  #---------------- Django-Vite  -----------------------------------

  vite:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.vite

    ports:
      - '5173:5173'

    volumes:
        - ../frontend:/app
        - /app/node_modules
    healthcheck:
        test: ["CMD","curl", "-f", "http://localhost:5173"]
        interval: 10s
        retries: 5
        start_period: 10s
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile

    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:

      - media:/app/media
      - static:/app/staticfiles

    depends_on:
       db:
          condition: service_healthy
       redis:
          condition: service_started
       vite:
          condition: service_healthy
    command: /entrypoint.sh

  # ------------CELERY WORKER -------------------------------

  celery:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0      
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
          condition: service_healthy
      redis:
          condition: service_started
    command: celery -A config worker -l info

  # ------------- NGINX ---------------------------------

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      -  static:/app/staticfiles
      -  media:/app/media

    depends_on:
      - web

volumes:
    postgres_data:
    media:
    static:
